name: CelestialDash
main: com.minico.celestialdash.CelestialDash
version: 1.1.7
api-version: 1.20
author: Minico
description: Storm-powered dashes, Celestial Amulets, and an optional resource pack.
website: https://github.com/Miniico/CelestialDash
softdepend: [PlaceholderAPI]

commands:
  celestialdash:
    description: CelestialDash commands
    usage: |
      /celestialdash chronicle - Recover your Chronicle
      /celestialdash give <player> <amount> - Give Celestial Tears to a player
      /celestialdash chronicle give <player> - Give a Chronicle copy to a player
      /celestialdash pack send <player> - Send the configured resource pack to a player
      /celestialdash reload - Reload the plugin configuration
    aliases: [cdash, celestial]

permissions:
  celestialdash.*:
    description: Grants all CelestialDash permissions
    default: op
    children:
      celestialdash.use: true
      celestialdash.bypass-dash-blacklist: true
      celestialdash.receive: true
      celestialdash.amulet: true
      celestialdash.chronicle: true
      celestialdash.admin: true

  celestialdash.use:
    description: Allows using Celestial Tears to dash
    default: true

  celestialdash.bypass-dash-blacklist:
    description: Allows using Celestial Dash in blacklisted worlds
    default: op

  celestialdash.receive:
    description: Allows receiving Celestial Tears from storm drops
    default: true

  celestialdash.amulet:
    description: Allows using the Celestial Amulet
    default: true

  celestialdash.chronicle:
    description: Allows recovering The Falling Sky with /celestialdash chronicle
    default: true

  celestialdash.admin:
    description: Allows using admin commands (give, chronicle give, pack send, reload)
    default: op
