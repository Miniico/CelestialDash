# CelestialDash configuration

# Chance per second for a tear to drop near a player during a storm (0.0 - 1.0)
drop-chance-per-second: 0.03

# Cooldown between drops for each player (in seconds, 0 - 86400)
drop-cooldown-seconds: 60

# Where storm-generated Tears are delivered: GROUND or INVENTORY.
# INVENTORY drops any overflow at the player's location.
drop-delivery: "GROUND"

# Worlds where Celestial Tears will NOT drop during storms
drop-blacklist-worlds:
  - "world_nether"
  - "world_the_end"
  # Add any other world names here

# Dash cooldown per player (in seconds, 0 - 86400)
dash-cooldown-seconds: 10

# Worlds where Celestial Dash cannot be used. Players with celestialdash.bypass-dash-blacklist bypass this list.
dash-blacklist-worlds: []

# Dash horizontal strength (forward push)
dash-strength: 1.8

# Dash vertical lift
dash-vertical-lift: 0.4

# Custom model data for new Celestial Tears. The bundled pack uses 22001.
# Set to 0 to disable the custom appearance. Existing Tears remain valid.
tear-custom-model-data: 22001

# Maximum players whose %celestialdash_tears% value is cached at once (1 - 10000).
# Raise this for very large servers with scoreboards or tab lists that use the placeholder.
placeholder-tear-cache-max-entries: 256

# Optional server resource pack delivery settings.
# The bundled Google Drive URL and SHA-1 are ready to use.
# Set enabled to true to send the bundled pack to players when they join.
# Leave required false to let players decline the download; true disconnects players who decline it.
# sha1 must contain the ZIP's 40-character SHA-1 when enabled is true.
# Players receive the pack when they join; reload this configuration before new players join.
resource-pack:
  enabled: false
  url: "https://drive.google.com/uc?export=download&id=1FXO5hS3Rg7FAUsn6Oq6ZdENKq0hBYS9C"
  sha1: "21ddb9da21e3f74b41514d662700a25c2b10a750"
  required: false
  prompt: "&bThis server uses the CelestialDash resource pack."

# Give each player The Falling Sky once when they join after updating to 1.1.7.
# Set false to disable only automatic delivery; players can still recover it and admins can reissue it.
chronicle:
  enabled: true
  # Notify the recipient in their supported game language when a copy is delivered.
  notification-enabled: true
  # Play a quiet page-turn sound when a copy is delivered.
  delivery-sound-enabled: true
  # Time before a player can use /celestialdash chronicle again (0 - 86400).
  self-reissue-cooldown-seconds: 300

# Maximum amount accepted by /celestialdash give (1 to 2304)
give-max-amount: 2304

# Craftable Celestial Amulet: right-click to remove harmful effects and extinguish fire.
# Recipe: four Celestial Tears around one Netherite Ingot.
celestial-amulet:
  enabled: true
  recipe-enabled: true
  uses: 3                # Uses granted to each newly crafted amulet (1 to 64)
  # The bundled resource pack uses 22002. Set to 0 to disable the custom appearance.
  custom-model-data: 22002
  cooldown-seconds: 60   # Time between uses, in seconds (0 to 86400)
  # Bukkit potion effect names removed by the amulet. Invalid entries are ignored with a warning.
  # Fire is always extinguished.
  purifiable-effects:
    - POISON
    - WITHER
    - SLOW
    - WEAKNESS
    - BLINDNESS
    - HUNGER
    - LEVITATION
    - DARKNESS
    - UNLUCK
    - BAD_OMEN

# Regeneration effect after dashing
regen-duration-seconds: 5
regen-amplifier: 0   # 0 = Regeneration I, 1 = Regeneration II, etc.

# Dash impact particle (particle counts are limited to 500).
# Types requiring additional particle data fall back to CLOUD.
dash-particle-enabled: true
dash-particle-type: "CLOUD"
dash-particle-count: 40
dash-particle-offset-x: 0.4
dash-particle-offset-y: 0.5
dash-particle-offset-z: 0.4
dash-particle-speed: 0.02

# Dash sound
dash-sound-enabled: true
dash-sound-name: "ENTITY_PHANTOM_FLAP"
dash-sound-volume: 1.2
dash-sound-pitch: 0.6

# Wind trail settings (particle counts are limited to 500).
# Every dash is additionally limited to 5,000 trail particles in total; if needed,
# trail-particle-count is lowered automatically when this configuration is loaded.
# Types requiring additional particle data fall back to CLOUD.
trail-enabled: true
trail-particle-type: "CLOUD"
trail-particle-count: 20
trail-offset-x: 0.3
trail-offset-y: 0.4
trail-offset-z: 0.3
trail-speed: 0.01
trail-duration-ticks: 10
trail-interval-ticks: 1

# Double Dash system
double-dash:
  enabled: true
  window-ms: 4000            # Time allowed between dash1 and dash2 (milliseconds)
  fall-immunity-ticks: 40   # Prevent fall damage ONLY after the second dash (2 seconds = 40 ticks)
  strength-multiplier: 1.2  # Horizontal strength multiplier for the second dash (0.0 to 10.0)
  lift-multiplier: 1.1      # Vertical lift multiplier for the second dash (0.0 to 10.0)

# Messages (supports & color codes)
messages:
  cooldown: "&7Celestial Dash ready in &b%seconds%s&7."
  no-admin-permission: "&cYou don't have permission to use this command."
  no-use-permission: "&cYou don't have permission to use Celestial Dash."
  dash-world-disabled: "&cCelestial Dash is disabled in this world."
  no-amulet-permission: "&cYou don't have permission to use the Celestial Amulet."
  no-tears: "&cYou need at least one &bCelestial Tear &cto use Celestial Dash."
  dash-used: "&bThe celestial wind pushes you forward!"
  second-dash: "&bYou unleash a second celestial dash!"
  tear-drop: "&bA celestial tear materializes from the storm..."
  config-reloaded: "&aCelestialDash configuration reloaded."
  player-not-found: "&cPlayer not found: %player%"
  invalid-amount: "&cInvalid amount. Must be a number between 1 and %max%."
  give-success: "&bGave %amount% Celestial Tears to %player%"
  give-overflow: "&eThe inventory was full; the remaining Tears were dropped at %player%'s location."
  chronicle-given: "&bGave The Falling Sky to %player%."
  chronicle-overflow: "&eThe inventory was full; the Chronicle was dropped at %player%'s location."
  no-chronicle-permission: "&cYou don't have permission to recover The Falling Sky."
  chronicle-player-only: "&cOnly players can recover The Falling Sky."
  chronicle-reissue-cooldown: "&7You can recover another Chronicle in &b%seconds%s&7."
  resource-pack-sent: "&aThe resource-pack request was sent to %player%."
  resource-pack-disabled: "&cResource-pack delivery is disabled in the configuration."
